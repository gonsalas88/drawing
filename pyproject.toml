[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing"
version = "0.1.0"
description = "Pacote de exemplo com funções de desenho"
authors = [
    {name = "your name"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

